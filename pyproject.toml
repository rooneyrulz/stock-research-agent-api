[project]
name = "stock-research-agent-api"
version = "0.1.0"
description = "Multi-agent system for stock research and analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "crewai>=1.15.17",
    "fastapi>=0.141.1",
    "groq>=1.7.0",
    "pandas>=3.0.5",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.52.4",
    "yfinance>=1.7.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
